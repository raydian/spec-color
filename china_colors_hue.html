<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国传统色 · 季节 / 色系双模式色谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --sel:#779649; --txt:#f6f2ea;
    --font-title:"HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans SC","Source Han Sans SC","Source Han Sans CN","PingFang SC",sans-serif;
    --font-body:"Noto Sans SC","Source Han Sans SC","Source Han Sans CN","PingFang SC","Microsoft YaHei",sans-serif;
    --font-num:"Inter","Noto Sans SC","PingFang SC",sans-serif; }
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{ margin:0; background:var(--sel); color:var(--txt); transition:background .55s ease;
    font-family:var(--font-body); font-weight:400; overflow:hidden; }
  .app{ display:flex; height:100vh; }

  /* ---------- LEFT ---------- */
  .left{ width:50%; min-width:380px; height:100vh; overflow-y:auto; padding:22px 22px 60px;
    scrollbar-width:none; -ms-overflow-style:none; }
  .left::-webkit-scrollbar{ width:0; height:0; display:none; }
  .brand{ margin:2px 0 14px; }
  .brand h1{ margin:0; font-size:22px; letter-spacing:8px; font-family:var(--font-title); font-weight:900; }
  .brand p{ margin:5px 0 0; font-size:12px; letter-spacing:2px; opacity:.72; }

  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 22px; }
  .tab{ padding:6px 13px; border:1px solid rgba(127,127,127,.4); border-radius:999px;
    background:rgba(255,255,255,.10); color:var(--txt); cursor:pointer; font-size:13px;
    letter-spacing:2px; font-family:inherit; transition:.15s; }
  .tab:hover{ background:rgba(255,255,255,.24); }
  .tab.active{ background:var(--txt); color:var(--sel); border-color:transparent; }

  .group{ display:flex; gap:20px; padding:4px 0 20px; margin-bottom:20px;
    border-bottom:1px solid rgba(127,127,127,.28); }
  .group:last-child{ border-bottom:none; margin-bottom:0; }
  .season-label{ writing-mode:vertical-rl; font-size:17px; letter-spacing:8px;
    font-family:var(--font-title); font-weight:700; opacity:.92; padding-top:2px; flex:0 0 auto; }
  .chips{ display:flex; flex-wrap:wrap; gap:14px 12px; align-content:flex-start; }
  .chip{ width:34px; height:104px; border-radius:7px; writing-mode:vertical-rl;
    display:flex; align-items:center; justify-content:center; padding:8px 0;
    cursor:pointer; border:1px solid rgba(0,0,0,.10);
    box-shadow:0 1px 2px rgba(0,0,0,.10), inset 0 0 0 1px rgba(255,255,255,.05);
    transition:transform .14s, box-shadow .14s, outline-color .14s; outline:2px solid transparent; }
  .chip .cn{ font-size:14px; letter-spacing:3px; font-weight:600; line-height:1; }
  .chip:hover{ transform:translateY(-3px) scale(1.04); box-shadow:0 7px 16px rgba(0,0,0,.20); }
  .chip.active{ outline-color:var(--txt); }

  /* ---------- RIGHT ---------- */
  .right{ flex:1; height:100vh; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px 5% 90px; overflow:hidden; text-align:center; }
  .season-tag{ font-size:17px; letter-spacing:8px; font-family:var(--font-title); font-weight:700;
    opacity:.9; margin-bottom:26px; }
  .bigname{ writing-mode:vertical-rl; font-size:clamp(80px,16vh,168px); letter-spacing:28px;
    font-family:var(--font-title); font-weight:900; line-height:1; margin-bottom:34px; }
  .desc{ max-width:48ch; font-size:15.5px; line-height:2.0; letter-spacing:2px; opacity:.93; margin:0 0 14px; }
  .usage{ max-width:48ch; font-size:13.5px; line-height:1.9; letter-spacing:1.5px; opacity:.72; }
  .usage::before{ content:"建议场景 · "; font-weight:600; }

  .poem-col{ position:absolute; right:6.5%; top:50%; transform:translateY(-50%);
    display:flex; align-items:flex-start; gap:16px; text-align:left; }
  .poem-text{ writing-mode:vertical-rl; font-size:19px; letter-spacing:9px; line-height:2.1; max-height:52vh; }
  .poem-from{ writing-mode:vertical-rl; font-size:13.5px; letter-spacing:5px; opacity:.8; }

  .copybar{ position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    display:flex; gap:14px; }
  .copybtn{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px;
    border:1px solid rgba(127,127,127,.45); border-radius:999px; background:rgba(255,255,255,.12);
    color:var(--txt); font-family:var(--font-num); font-weight:500; font-size:13.5px;
    letter-spacing:.5px; cursor:pointer; transition:.15s; }
  .copybtn:hover{ background:rgba(255,255,255,.26); transform:translateY(-1px); }
  .copybtn svg{ display:block; }

  .toast{ position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(16px);
    background:rgba(0,0,0,.72); color:#fff; padding:9px 18px; border-radius:10px; font-size:13.5px;
    letter-spacing:1px; opacity:0; transition:.25s; pointer-events:none; z-index:50; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media(max-width:860px){
    .app{flex-direction:column}
    .left{width:100%;min-width:0;height:50vh}
    .right{height:50vh; padding-bottom:80px}
    .bigname{font-size:clamp(54px,11vh,100px); margin-bottom:20px}
    .poem-col{position:static; transform:none; margin-top:18px}
    .desc{font-size:14px}
  }

  /* ---------- SWITCHER ---------- */
  .switcher{ display:flex; align-items:center; gap:9px; margin:14px 0 0; flex-wrap:wrap;
    padding:12px 13px; border:1px solid rgba(127,127,127,.30); border-radius:14px;
    background:rgba(255,255,255,.06); }
  .switcher .lb{ font-size:11px; letter-spacing:2px; opacity:.66; margin-right:1px; }
  .selwrap{ position:relative; }
  .selwrap select{ appearance:none; -webkit-appearance:none; width:100%; padding:7px 28px 7px 12px;
    border:1px solid rgba(127,127,127,.42); border-radius:9px; background:rgba(255,255,255,.12);
    color:var(--txt); font-family:inherit; font-size:12.5px; letter-spacing:1.5px; cursor:pointer;
    outline:none; transition:.15s; }
  .selwrap select:hover,.selwrap select:focus{ background:rgba(255,255,255,.26); }
  .selwrap select option{ color:#2b2724; background:#fff; letter-spacing:1px; }
  .selwrap::after{ content:""; position:absolute; right:12px; top:50%; width:6px; height:6px;
    border-right:1.6px solid var(--txt); border-bottom:1.6px solid var(--txt);
    transform:translateY(-70%) rotate(45deg); pointer-events:none; opacity:.85; }
  .mode-wrap{ min-width:196px; } .dim-wrap{ min-width:104px; }
  .switcher .div{ width:1px; height:22px; background:rgba(127,127,127,.38); margin:0 2px; }
  .seghint{ margin:9px 0 0; font-size:11.5px; line-height:1.8; letter-spacing:1.2px; opacity:.6; }
  .seghint b{ font-weight:600; opacity:.95; }

  /* ---------- TABS ---------- */
  .tab{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; }
  .tab .dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .tab .cnt{ font-family:var(--font-num); font-size:11px; opacity:.6; }
  .tab.active .dot{ box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 0 0 2px rgba(255,255,255,.35); }
  .tab.zero{ opacity:.38; }

  /* ---------- GROUP ---------- */
  .group-label{ writing-mode:vertical-rl; font-size:17px; letter-spacing:8px;
    font-family:var(--font-title); font-weight:700; opacity:.92; padding-top:2px; flex:0 0 auto; }
  .group-sub{ writing-mode:vertical-rl; font-size:10.5px; letter-spacing:2.5px; opacity:.55;
    font-family:var(--font-num); align-self:flex-start; margin-top:6px; white-space:nowrap; }
  .fam-desc{ font-size:11px; letter-spacing:1.5px; opacity:.5; padding:6px 0 22px; }

  /* ---------- RIGHT ---------- */
  .tagrow{ display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:16px;
    flex-wrap:wrap; }
  .badge{ display:inline-flex; align-items:center; gap:7px; padding:5px 13px 5px 9px;
    border:1px solid rgba(127,127,127,.40); border-radius:999px; background:rgba(255,255,255,.09);
    font-size:12.5px; letter-spacing:1.5px; }
  .badge.plain{ padding:5px 13px; }
  .badge .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .badge .k{ font-size:10.5px; opacity:.55; letter-spacing:1px; }
  .season-tag{ margin-bottom:0; font-size:12.5px; letter-spacing:2px; opacity:.72; font-family:inherit;
    font-weight:400; }
  .metrics{ margin:0 0 22px; font-family:var(--font-num); font-size:11.5px; letter-spacing:1px;
    opacity:.6; }
  .metrics b{ font-weight:600; opacity:.9; }

  @media(max-width:880px){ .right{ padding-top:12px } .tagrow{ margin-bottom:12px } }
</style>

<div class="app">
  <div class="left">
    <div class="brand">
      <h1>中 国 传 统 色</h1>
      <p>二十四节气 · 三百八十四色 · 十二色系 · 明度 / 饱和度双维度</p>

    <div class="metrics" id="rMetrics"></div>
    <div class="bigname" id="rName"></div>
    <div class="desc" id="rDesc"></div>

    <div class="copybar">
      <button class="copybtn" id="cpHex"></button>
      <button class="copybtn" id="cpRgb"></button>
      <button class="copybtn" id="cpHsl"></button>
      <button class="copybtn" id="cpTag"></button>
    </div>
  </div>
</div>

<script>
const PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
const FLAT = PAYLOAD.reduce((a,g)=>a.concat(g.colors),[]);

const FAM_DESC  = {"红色系": "正红、朱红、绛红、暗红", "橙色系": "橙、橘、朱橙", "黄色系": "黄、金黄、鹅黄", "绿色系": "草绿、翠绿、墨绿", "青色系": "青绿、蓝绿、碧、铜青", "蓝色系": "天蓝、湖蓝、靛蓝、深蓝", "紫色系": "紫、蓝紫、深紫", "粉色系": "桃粉、樱粉、胭脂粉", "棕褐色系": "棕、褐、赭、茶", "米杏色系": "米、杏、沙、暖灰黄", "白灰色系": "白、银灰、冷灰、暖灰", "黑墨色系": "黑、墨、玄、近黑"};
const LIGHT_NOTE= {"浅色": "L* ≥ 0.78", "中色": "0.50 ≤ L* < 0.78", "深色": "L* < 0.50"};
const SAT_NOTE  = {"柔和": "彩度比 < 0.42", "标准": "0.42 ≤ 彩度比 < 0.75", "鲜艳": "彩度比 ≥ 0.75"};
const FAM_ORDER = Object.keys(FAM_DESC);

const SEASON_GROUPS = PAYLOAD.map(g=>({ key:g.category, label:g.category, colors:g.colors }));

function avgHex(colors){
  const s=[0,0,0];
  colors.forEach(c=>{ s[0]+=c.r; s[1]+=c.g; s[2]+=c.b; });
  const k=colors.length||1;
  return 'rgb('+s.map(v=>Math.round(v/k)).join(',')+')';
}
SEASON_GROUPS.forEach(g=>g.dot=avgHex(g.colors));

const modeSel  = document.getElementById('modeSel');
const lightSel = document.getElementById('lightSel');
const satSel   = document.getElementById('satSel');
const countLb  = document.getElementById('countLb');
const hintEl   = document.getElementById('hint');
const tabsEl   = document.getElementById('tabs');
const groupsEl = document.getElementById('groups');
const leftEl   = document.querySelector('.left');
const rFam=document.getElementById('rFam'), rLight=document.getElementById('rLight'),
      rSat=document.getElementById('rSat'), rSeason=document.getElementById('rSeason'),
      rMetrics=document.getElementById('rMetrics'), rName=document.getElementById('rName'),
      rDesc=document.getElementById('rDesc'), rUsage=document.getElementById('rUsage'),
      rPoem=document.getElementById('rPoem'), rFrom=document.getElementById('rFrom');
const cpHex=document.getElementById('cpHex'), cpRgb=document.getElementById('cpRgb'),
      cpHsl=document.getElementById('cpHsl'), cpTag=document.getElementById('cpTag');

const LIGHTS = ['浅色','中色','深色'];
const SATS   = ['柔和','标准','鲜艳'];
LIGHTS.forEach(v=> lightSel.appendChild(new Option(v, v)));
SATS.forEach(v=> satSel.appendChild(new Option(v, v)));

const HINT = {
  season:'按<b>节气</b>筛选：二十四节气各收十六色，保留原编排顺序；每个色块在提示中标注其十二色系与明度、饱和度。',
  family:'按<b>色系</b>筛选：全谱经 sRGB → OKLCH 换算后，以「彩度 + 色相 + 明度」自动归入十二个一级色系，族内由浅至深排列。'
};

let mode='season', selKey={season:'__ALL__', family:'__ALL__'}, light='', sat='';
let selected = FLAT.find(c=>c.name==='青冥') || FLAT[0];

const ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

function txtColor(r,g,b){ return (0.299*r+0.587*g+0.114*b) > 150 ? '#2b2724' : '#f6f2ea'; }
function esc(s){ return (s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function rgbStr(c){ return 'rgb(' + c.r + ', ' + c.g + ', ' + c.b + ')'; }
function hslStr(c){
  const r=c.r/255,g=c.g/255,b=c.b/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2;
  let h=0,s=0;
  if(d){
    s = d/(1-Math.abs(2*l-1));
    if(mx===r) h=((g-b)/d + (g<b?6:0));
    else if(mx===g) h=((b-r)/d + 2);
    else h=((r-g)/d + 4);
    h*=60;
  }
  return 'hsl(' + Math.round(h) + ', ' + Math.round(s*100) + '%, ' + Math.round(l*100) + '%)';
}
function oklchStr(c){
  return 'oklch(' + Math.round(c.okL*100) + '% ' + c.okC.toFixed(3) + ' ' + Math.round(c.okH) + ')';
}
function tagStr(c){ return c.fam + ' / ' + c.light + ' / ' + c.sat; }

function pass(c){ return (!light || c.light===light) && (!sat || c.sat===sat); }
function famColors(name){ return FLAT.filter(c=>c.fam===name && pass(c)).slice().sort((a,b)=>b.okL-a.okL); }
function currentGroups(){
  if(mode==='season')
    return SEASON_GROUPS.map(g=>({key:g.key, label:g.label, dot:g.dot, colors:g.colors.filter(pass)}));
  return FAM_ORDER.map(n=>({key:n, label:n, dot:avgHex(FLAT.filter(c=>c.fam===n)), colors:famColors(n)}));
}
function activeKey(){ return selKey[mode]; }
function shownTotal(){ return currentGroups().reduce((a,g)=>a+g.colors.length,0); }

/* ---- tabs ---- */
function renderTabs(){
  tabsEl.innerHTML='';
  const total = shownTotal();
  tabsEl.appendChild(mkTab('__ALL__','全部', null, total));
  currentGroups().forEach(g=>tabsEl.appendChild(mkTab(g.key,g.label,g.dot,g.colors.length)));
}
function mkTab(key,label,dot,count){
  const b=document.createElement('button');
  b.className='tab'+(key===activeKey()?' active':'');
  b.dataset.key=key;
  b.title = (mode==='family' && FAM_DESC[label]) ? (label+' · '+FAM_DESC[label]) : label;
  b.innerHTML='<span class="dot" style="background:'+(dot|| 'rgba(127,127,127,.5)')+'"></span>'
    +'<span>'+esc(label)+'</span><span class="cnt">'+count+'</span>';
  b.onclick=()=>{ selKey[mode]=key; syncTabs(); renderGroups(); };
  return b;
}
function syncTabs(){ [...tabsEl.children].forEach(t=>t.classList.toggle('active', t.dataset.key===activeKey())); }

/* ---- chips ---- */
function chipHTML(c){
  const font=c.fontColor||txtColor(c.r,c.g,c.b);
  const tip=esc(c.name)+'  '+esc(c.hex)
    +'\n色系：'+esc(c.fam)+'（'+esc(FAM_DESC[c.fam]||'')+'）'
    +'\n明度：'+esc(c.light)+'（L* '+c.okL.toFixed(3)+'）    饱和度：'+esc(c.sat)+'（彩度比 '+c.ratio.toFixed(2)+'）'
    +'\n节气：'+esc(c.category);
  return '<div class="chip'+(c.hex===selected.hex?' active':'')+'" data-hex="'+c.hex+'" title="'+tip+'"'
    +' style="background:'+c.hex+';color:'+font+'"><span class="cn">'+esc(c.name)+'</span></div>';
}
function renderGroups(){
  groupsEl.innerHTML='';
  const key=activeKey();
  let list=currentGroups();
  if(key!=='__ALL__') list=list.filter(g=>g.key===key);
  let shown=0;
  list.forEach(g=>{
    if(!g.colors.length) return;
    shown+=g.colors.length;
    const sec=document.createElement('div');
    sec.className='group';
    let sub;
    if(mode==='season'){ sub=g.colors.length+' 色'; }
    else {
      const L=g.colors.map(c=>c.okL);
      sub=g.colors.length+' 色 · L* '+Math.min.apply(null,L).toFixed(2)+'–'+Math.max.apply(null,L).toFixed(2);
    }
    sec.innerHTML='<div class="group-label">'+esc(g.label)+'</div>'
      +'<div class="group-sub">'+esc(sub)+'</div>'
      +'<div class="chips">'+g.colors.map(chipHTML).join('')+'</div>';
    groupsEl.appendChild(sec);
  });
  if(mode==='family' && key==='__ALL__'){
    const d=document.createElement('p');
    d.className='fam-desc';
    d.textContent='共十二色系，由「色相 + 彩度 + 明度」自动归类，与色名用字无关。';
    groupsEl.appendChild(d);
  }
  if(!shown){
    groupsEl.innerHTML='<p class="fam-desc">当前筛选组合没有匹配的颜色，请调整明度或饱和度。</p>';
  }
  countLb.textContent='当前 '+shownTotal()+' 色';
}

/* ---- right ---- */
function renderRight(){
  document.documentElement.style.setProperty('--sel', selected.hex);
  document.documentElement.style.setProperty('--txt', txtColor(selected.r,selected.g,selected.b));
  rFam.querySelector('.dot').style.background=selected.hex;
  rFam.querySelector('.nm').textContent=selected.fam;
  rFam.title=FAM_DESC[selected.fam]||'';
  rLight.textContent='明度 · '+selected.light;
  rSat.textContent='饱和 · '+selected.sat;
  rSeason.textContent='节气 · '+selected.category;
  rMetrics.innerHTML='OKLCH <b>L '+selected.okL.toFixed(3)+'</b> · <b>C '+selected.okC.toFixed(3)
    +'</b> · <b>h '+Math.round(selected.okH)+'°</b> &nbsp;|&nbsp; 彩度比 <b>'+selected.ratio.toFixed(2)+'</b>';
  rName.textContent=selected.name;
  rDesc.textContent=selected.desc||'';
  rUsage.textContent=selected.usage||'';
  rPoem.textContent=selected.sentence||'';
  rFrom.textContent=[selected.sentenceFrom?('「'+selected.sentenceFrom+'」'):'',selected.author].filter(Boolean).join(' ');
  cpHex.innerHTML=ICON+'<span>'+selected.hex+'</span>';
  cpRgb.innerHTML=ICON+'<span>'+rgbStr(selected)+'</span>';
  cpHsl.innerHTML=ICON+'<span>'+hslStr(selected)+'</span>';
  cpTag.innerHTML=ICON+'<span>'+tagStr(selected)+'</span>';
}

/* ---- mode / filter ---- */
function setMode(m, keepScroll){
  mode=m; modeSel.value=m;
  if(m!=='family') ; else if(selKey.family!=='__ALL__' && !FAM_DESC[selKey.family]) selKey.family='__ALL__';
  refresh(keepScroll);
}
function refresh(keepScroll){
  hintEl.innerHTML = HINT[mode] + ' 明度：<b>'
    + (light? light+'（'+LIGHT_NOTE[light]+'）' : '全部（浅色 / 中色 / 深色）') + '</b>　饱和度：<b>'
    + (sat? sat+'（'+SAT_NOTE[sat]+'）' : '全部（柔和 / 标准 / 鲜艳）') + '</b>';
  renderTabs(); renderGroups(); renderRight();
  if(!keepScroll) leftEl.scrollTop=0;
}
modeSel.addEventListener('change', e=>{ const m=e.target.value; if(location.hash.replace('#','')!==m) location.hash=m; setMode(m,true); });
lightSel.addEventListener('change', e=>{ light=e.target.value; refresh(true); });
satSel.addEventListener('change', e=>{ sat=e.target.value; refresh(true); });

function parseHash(){
  let raw=location.hash||'';
  try{ raw=decodeURIComponent(raw); }catch(e){}
  const parts=raw.replace('#','').split('.').filter(Boolean);
  const m = parts[0]==='family' ? 'family' : 'season';
  const l = LIGHTS.includes(parts[1]) ? parts[1] : '';
  const s = SATS.includes(parts[2]) ? parts[2] : '';
  return {m,l,s};
}
window.addEventListener('hashchange', ()=>{ const h=parseHash(); modeSel.value=h.m; lightSel.value=h.l; satSel.value=h.s; mode=h.m; light=h.l; sat=h.s; refresh(true); });

groupsEl.addEventListener('click', e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  const c=FLAT.find(x=>x.hex===chip.dataset.hex); if(!c) return;
  selected=c; renderRight();
  [...groupsEl.querySelectorAll('.chip')].forEach(el=>el.classList.toggle('active', el.dataset.hex===c.hex));
});

function bindCopy(btn, getVal){
  btn.addEventListener('click', ()=>{ const v=getVal();
    navigator.clipboard?.writeText(v).then(()=>toast('已复制 '+v)).catch(()=>toast(v)); });
}
bindCopy(cpHex, ()=>selected.hex);
bindCopy(cpRgb, ()=>rgbStr(selected));
bindCopy(cpHsl, ()=>hslStr(selected));
bindCopy(cpTag, ()=>tagStr(selected));

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400);
}

(function init(){
  const h=parseHash();
  mode=h.m; light=h.l; sat=h.s;
  modeSel.value=mode; lightSel.value=light; satSel.value=sat;
  refresh(false);
})();
</script>

</body>
</html>
